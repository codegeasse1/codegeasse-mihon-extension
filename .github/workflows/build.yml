              return None

          for ext_dir in sorted(Path("src").glob("*/*")):
              if not ext_dir.is_dir():
                  continue

              ext_name = ext_dir.name
              target_icon = ext_dir / "src" / "main" / "res" / "mipmap-xxxhdpi" / "ic_launcher.png"

              if target_icon.exists():
