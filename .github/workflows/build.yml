name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build every extension (debug APKs)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      - name: Build and Sign Release APKs
        run: >
          gradle assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs
        run: |
          mkdir -p repo/apk
          find . -path '*/build/outputs/apk/release/*.apk' -exec cp {} repo/apk/ \;

      # Static, complete index in the exact format Keiyoushi/Mihon/Aniyomi expect.
      # When you update an extension, bump "code" and "version" here manually.
      - name: Generate index.min.json
        run: |
          cat > repo/index.min.json <<'EOF'
          [
            {
              "name": "Comix",
              "pkg": "eu.kanade.tachiyomi.extension.en.comix",
              "apk": "https://raw.githubusercontent.com/codegeasse1/codegeasse-mihon-extension/repo/apk/comix-release.apk",
              "lang": "en",
              "code": 1,
              "version": "1.1",
              "nsfw": 0,
              "hasReadme": 0,
              "hasChangelog": 0,
              "sources": [
                { "id": 1, "lang": "en", "name": "Comix", "baseUrl": "https://comix.to", "versionId": 1 }
              ]
            },
            {
              "name": "Example",
              "pkg": "eu.kanade.tachiyomi.extension.en.example",
              "apk": "https://raw.githubusercontent.com/codegeasse1/codegeasse-mihon-extension/repo/apk/example-release.apk",
              "lang": "en",
              "code": 1,
              "version": "1.1",
              "nsfw": 0,
              "hasReadme": 0,
              "hasChangelog": 0,
              "sources": [
                { "id": 2, "lang": "en", "name": "Example", "baseUrl": "https://example.com", "versionId": 1 }
              ]
            }
          ]
          EOF
          cat repo/index.min.json

      - name: Publish to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
