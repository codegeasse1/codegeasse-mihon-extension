name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build every extension (debug APKs)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      - name: Build and Sign Release APKs
        run: >
          gradle assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Generate Index and Copy Files (Cache Busting)
        run: |
          python3 -c "
          import os, re, json, hashlib, struct, shutil
          
          # Tachiyomi/Mihon Math ID Generator
          def generate_id(name, lang, version_id=1):
              key = f'{lang}/{name}/{version_id}'.encode('utf-8')
              md5_bytes = hashlib.md5(key).digest()
              return struct.unpack('>q', md5_bytes[:8])[0]

          repo = os.environ.get('GITHUB_REPOSITORY', 'codegeasse1/codegeasse-mihon-extension')
          url_base = f'https://raw.githubusercontent.com/{repo}/repo'
          index = []
          
          os.makedirs('repo/apk', exist_ok=True)
          os.makedirs('repo/icon', exist_ok=True)
          
          if os.path.exists('src'):
              for lang in os.listdir('src'):
                  lang_path = os.path.join('src', lang)
                  if not os.path.isdir(lang_path): continue
                  for ext in os.listdir(lang_path):
                      ext_path = os.path.join(lang_path, ext)
                      if not os.path.isdir(ext_path): continue
                      
                      gradle = os.path.join(ext_path, 'build.gradle.kts')
                      if not os.path.exists(gradle): continue
                      
                      gc = open(gradle).read()
                      name_match = re.search(r'val extName\s*=\s*\"([^\"]+)\"', gc)
                      code_match = re.search(r'val extVersionCode\s*=\s*(\d+)', gc)
                      nsfw_match = re.search(r'val isNsfw\s*=\s*(true|false)', gc)
                      pkg_match = re.search(r'applicationId\s*=\s*\"([^\"]+)\"', gc)
                      
                      if not pkg_match: continue
                          
                      name = name_match.group(1) if name_match else ext.capitalize()
                      code_val = int(code_match.group(1)) if code_match else 1
                      nsfw_val = 2 if (nsfw_match and nsfw_match.group(1) == 'true') else 0
                      pkg = pkg_match.group(1)
                      
                      # Bulletproof scan for baseUrl and ID
                      base_url_val = 'https://example.com'
                      src_id = None
                      
                      for r, _, fs in os.walk(os.path.join(ext_path, 'src/main/kotlin')):
                          for f in fs:
                              if f.endswith('.kt'):
                                  content = open(os.path.join(r, f), encoding='utf-8').read()
                                  b_match = re.search(r'override\s+val\s+baseUrl\s*=\s*\"([^\"]+)\"', content)
                                  if b_match: base_url_val = b_match.group(1)
                                  
                                  id_match = re.search(r'override\s+val\s+id[^=]*=\s*(-?\d+)', content)
                                  if id_match: src_id = int(id_match.group(1))

                      if src_id is None:
                          src_id = generate_id(name, lang)
                          
                      # File copying logic with Cache Busting
                      apk_src_dir = os.path.join(ext_path, 'build', 'outputs', 'apk', 'release')
                      icon_src = os.path.join(ext_path, 'src', 'main', 'res', 'mipmap-xxxhdpi', 'ic_launcher.png')
                      
                      apk_filename = f'{ext}-v{code_val}.apk'
                      icon_filename = f'{ext}-v{code_val}.png'
                      
                      if os.path.exists(apk_src_dir):
                          for f in os.listdir(apk_src_dir):
                              if f.endswith('.apk'):
                                  shutil.copy(os.path.join(apk_src_dir, f), os.path.join('repo', 'apk', apk_filename))
                                  break
                      
                      if os.path.exists(icon_src):
                          shutil.copy(icon_src, os.path.join('repo', 'icon', icon_filename))
                          
                      index.append({
                          'name': name,
                          'pkg': pkg,
                          'apk': f'{url_base}/apk/{apk_filename}',
                          'lang': lang,
                          'code': code_val,
                          'version': f'1.4.{code_val}',
                          'nsfw': nsfw_val,
                          'hasReadme': 0,
                          'hasChangelog': 0,
                          'icon': f'{url_base}/icon/{icon_filename}',
                          'sources': [{'id': src_id, 'lang': lang, 'name': name, 'baseUrl': base_url_val, 'versionId': 1}]
                      })
                      
          with open('repo/index.min.json', 'w') as f: json.dump(index, f, separators=(',', ':'))
          with open('repo/repo.json', 'w') as f: json.dump(index, f, separators=(',', ':'))
          "
          cat repo/index.min.json

      - name: Publish to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
