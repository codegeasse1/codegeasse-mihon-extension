name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build every extension (debug APKs)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      - name: Build and Sign Release APKs
        run: >
          gradle assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs and Icons dynamically
        run: |
          mkdir -p repo/apk
          mkdir -p repo/icon
          for ext_dir in src/*/*/; do
            ext_name=$(basename "$ext_dir")
            lang=$(basename "$(dirname "$ext_dir")")

            # Read versionCode from build.gradle or build.gradle.kts
            gradle_file=""
            if [ -f "$ext_dir/build.gradle.kts" ]; then
              gradle_file="$ext_dir/build.gradle.kts"
            elif [ -f "$ext_dir/build.gradle" ]; then
              gradle_file="$ext_dir/build.gradle"
            fi

            if [ -n "$gradle_file" ]; then
              version_code=$(grep -oP 'extVersionCode\s*=\s*\K\d+' "$gradle_file" || echo "1")
            else
              version_code="1"
            fi

            # Read applicationId to use as icon filename
            if [ -n "$gradle_file" ]; then
              app_id=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' "$gradle_file" || echo "")
            fi

            # ✅ Rename APK to standard format: tachiyomi-{lang}.{name}-v1.{code}.apk
            apk_filename="tachiyomi-${lang}.${ext_name}-v1.${version_code}.apk"
            cp "$ext_dir/build/outputs/apk/release/"*.apk "repo/apk/${apk_filename}" 2>/dev/null || true

            # ✅ Rename icon to full package name: {applicationId}.png
            if [ -n "$app_id" ]; then
              icon_src=""
              if [ -f "$ext_dir/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
                icon_src="$ext_dir/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
              elif [ -f "$ext_dir/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
                icon_src="$ext_dir/src/main/res/mipmap-hdpi/ic_launcher.png"
              fi
              if [ -n "$icon_src" ]; then
                cp "$icon_src" "repo/icon/${app_id}.png"
              fi
            fi
          done
          echo "=== APKs ==="
          ls -la repo/apk
          echo "=== Icons ==="
          ls -la repo/icon

      - name: Generate index.min.json automatically
        run: |
          python3 -c "
          import os, re, json, hashlib

          index = []
          for lang in os.listdir('src'):
              lang_path = os.path.join('src', lang)
              if not os.path.isdir(lang_path): continue
              for ext in os.listdir(lang_path):
                  ext_path = os.path.join(lang_path, ext)
                  if not os.path.isdir(ext_path): continue

                  # ✅ FIX: Check both .kts and .gradle
                  gradle = os.path.join(ext_path, 'build.gradle.kts')
                  if not os.path.exists(gradle):
                      gradle = os.path.join(ext_path, 'build.gradle')
                  if not os.path.exists(gradle): continue

                  gc = open(gradle).read()
                  name = re.search(r'val extName\s*=\s*\"([^\"]+)\"', gc)
                  code = re.search(r'val extVersionCode\s*=\s*(\d+)', gc)
                  # ✅ FIX: Also match extName = '...' (single quotes)
                  if not name:
                      name = re.search(r\"val extName\s*=\s*'([^']+)'\", gc)
                  nsfw = re.search(r'val isNsfw\s*=\s*(true|false)', gc)
                  pkg = re.search(r'applicationId\s*=\s*\"([^\"]+)\"', gc)
                  if not all([name, code, pkg]): continue

                  code_val = code.group(1)
                  nsfw_val = 0
                  if nsfw and nsfw.group(1) == 'true':
                      nsfw_val = 2

                  # ✅ FIX: APK filename only, NOT full URL
                  apk_filename = f'tachiyomi-{lang}.{ext}-v1.{code_val}.apk'

                  kt_path = next((os.path.join(r, f) for r,_,fs in os.walk(os.path.join(ext_path, 'src/main/kotlin')) for f in fs if f.endswith('.kt')), None)
                  kt = open(kt_path).read() if kt_path else ''
                  b_url = re.search(r'override val baseUrl\s*=\s*\"([^\"]+)\"', kt)
                  src_id = int(hashlib.md5(pkg.group(1).encode()).hexdigest()[:8], 16)

                  index.append({
                      'name': name.group(1),
                      'pkg': pkg.group(1),
                      'apk': apk_filename,
                      'lang': lang,
                      'code': int(code_val),
                      'version': f'1.{code_val}',
                      'nsfw': nsfw_val,
                      'hasReadme': 0,
                      'hasChangelog': 0,
                      'sources': [{
                          'id': src_id,
                          'lang': lang,
                          'name': name.group(1),
                          'baseUrl': b_url.group(1) if b_url else '',
                          'versionId': 1
                      }]
                  })

          with open('repo/index.min.json','w') as f:
              json.dump(index, f, separators=(',',':'))
          "
          echo "=== Generated index.min.json ==="
          cat repo/index.min.json

      - name: Publish to repo branch
        run: |
          cd repo
          git init -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish extension repo"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:repo
