name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Normalize source icons before debug build
        shell: bash
        run: |
          set -e

          if command -v magick >/dev/null 2>&1; then
            IM="magick"
          else
            IM="convert"
          fi

          normalize_icon() {
            local input="$1"
            local output="$2"
          ...}</a>'
              )

          html_lines.extend([
              "  </pre>",
              "</body>",
              "</html>"
          ])

          with open("repo/index.html", "w", encoding="utf-8") as f:
              f.write("\n".join(html_lines))

          print(f"\nDONE: generated {len(index)} extension(s)")
          print("\n=== index.min.json ===")
          print(open("repo/index.min.json", encoding="utf-8").read())
          print("\n=== repo.json ===")
          print(open("repo/repo.json", encoding="utf-8").read())
          PYEOF

      - name: Publish to repo branch
        run: |
          cd repo
          git init -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish extension repo"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:repo
