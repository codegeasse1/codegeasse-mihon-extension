name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No committed Gradle wrapper jar is needed - this action provisions
      # a real Gradle distribution and puts `gradle` on PATH.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build every extension (debug APKs)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

  # Runs only on pushes to main, and only if `build` succeeded.
  # Bundles the compiled APKs plus an index.min.json and publishes them
  # to a `repo` branch, which can be added directly as a custom
  # extension repo inside Mihon/Aniyomi.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Write permissions are strictly required for the bot to push the repo branch
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      - name: Build and Sign Release APKs
        run: >
          gradle assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs
        run: |
          mkdir -p repo/apk
          find . -path '*/build/outputs/apk/release/*.apk' -exec cp {} repo/apk/ \;

      - name: Generate index.min.json
        run: |
          cd repo
          AAPT2=$(ls -1d $ANDROID_HOME/build-tools/* | tail -n 1)/aapt2
          BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/repo/apk"
          echo "[" > index.json
          FIRST=1
          for apk in apk/*.apk; do
            [ -f "$apk" ] || continue
            if [ $FIRST -eq 0 ]; then echo "," >> index.json; fi
            FIRST=0

            BADGING=$("$AAPT2" dump badging "$apk" 2>/dev/null || true)

            PKG=$(echo "$BADGING" | grep "^package: name=" | cut -d"'" -f2)
            CODE=$(echo "$BADGING" | grep "^package: name=" | cut -d"'" -f4)
            VERSION=$(echo "$BADGING" | grep "^package: name=" | cut -d"'" -f6)
            NAME=$(echo "$BADGING" | grep "^application-label:" | head -n 1 | cut -d"'" -f2)
            # Fallback if aapt can't read the label (icon error): derive from filename
            if [ -z "$NAME" ]; then
              NAME=$(basename "$apk" | sed 's/-release\.apk$//' | sed 's/^./\U&/')
            fi
            LANG=$(echo "$PKG" | cut -d'.' -f5)
            NSFW=0
            if echo "$BADGING" | grep -q "name='tachiyomi.extension.nsfw' value='2'"; then NSFW=2; fi
            if echo "$BADGING" | grep -q "name='tachiyomi.extension.nsfw' value='1'"; then NSFW=1; fi
            FILENAME=$(basename "$apk")

            echo "{\"name\":\"$NAME\",\"pkg\":\"$PKG\",\"apk\":\"$BASE_URL/$FILENAME\",\"version\":\"$VERSION\",\"code\":$CODE,\"lang\":\"$LANG\",\"nsfw\":$NSFW,\"hasReadme\":0,\"hasChangelog\":0}" >> index.json
          done
          echo "]" >> index.json
          jq -c . < index.json > index.min.json
          rm index.json
          cat index.min.json

      # THIS is the step that actually publishes everything to GitHub
      - name: Publish to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
