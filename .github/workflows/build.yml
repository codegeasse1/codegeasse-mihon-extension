name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build every extension (debug APKs)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      - name: Build and Sign Release APKs
        run: >
          gradle assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs and Icons dynamically
        run: |
          mkdir -p repo/apk
          mkdir -p repo/icon
          for ext_dir in src/*/*/; do
            if [ -d "$ext_dir" ]; then
              ext_name=$(basename "$ext_dir")
              cp "$ext_dir/build/outputs/apk/release/"*.apk "repo/apk/${ext_name}-release.apk" || true
              cp "$ext_dir/src/main/res/mipmap-xxxhdpi/ic_launcher.png" "repo/icon/${ext_name}.png" || true
            fi
          done
          ls -la repo/apk
          ls -la repo/icon

      - name: Generate index.min.json, index.json, and repo.json
        run: |
          python3 -c "
          import os, re, json, hashlib, struct
          
          # 1. FIXED: Correct 64-bit ID Generation required by Mihon
          def generate_id(name, lang, version_id=1):
              key = f'{lang}/{name}/{version_id}'.encode('utf-8')
              md5_bytes = hashlib.md5(key).digest()
              return struct.unpack('>q', md5_bytes[:8])[0]

          repo = os.environ['GITHUB_REPOSITORY']
          url_base = f'https://raw.githubusercontent.com/{repo}/repo'
          index = []
          
          # Dynamically read libVersion from gradle.properties
          lib_version = '1.6'
          if os.path.exists('gradle.properties'):
              with open('gradle.properties') as f:
                  m = re.search(r'libVersion\s*=\s*\"?([0-9\.]+)\"?', f.read())
                  if m: lib_version = m.group(1)
          
          for lang in os.listdir('src'):
              lang_path = os.path.join('src', lang)
              if not os.path.isdir(lang_path): continue
              for ext in os.listdir(lang_path):
                  ext_path = os.path.join(lang_path, ext)
                  if not os.path.isdir(ext_path): continue
                  gradle = os.path.join(ext_path, 'build.gradle.kts')
                  if not os.path.exists(gradle): continue
                  gc = open(gradle).read()
                  
                  name_match = re.search(r'val extName\s*=\s*\"([^\"]+)\"', gc)
                  code_match = re.search(r'val extVersionCode\s*=\s*(\d+)', gc)
                  nsfw_match = re.search(r'val isNsfw\s*=\s*(true|false)', gc)
                  pkg_match = re.search(r'applicationId\s*=\s*\"([^\"]+)\"', gc)
                  
                  if not all([name_match, code_match, nsfw_match, pkg_match]): continue
                  
                  name_val = name_match.group(1)
                  code_val = code_match.group(1)
                  pkg_val = pkg_match.group(1)
                  
                  kt_path = next((os.path.join(r, f) for r,_,fs in os.walk(os.path.join(ext_path, 'src/main/kotlin')) for f in fs if f.endswith('.kt')), None)
                  kt = open(kt_path).read() if kt_path else ''
                  b_url = re.search(r'override val baseUrl\s*=\s*\"([^\"]+)\"', kt)
                  b_url_val = b_url.group(1) if b_url else ''
                  
                  src_id = generate_id(name_val, lang)
                  
                  index.append({
                      'name': f'Tachiyomi: {name_val}',
                      'pkg': pkg_val,
                      # 2. FIXED: Restored absolute URLs for apk and icon
                      'apk': f'{url_base}/apk/{ext}-release.apk',
                      'lang': lang,
                      'code': int(code_val), 
                      'version': f'{lib_version}.{code_val}',  
                      'nsfw': 2 if nsfw_match.group(1)=='true' else 0,
                      'hasReadme': 0, 'hasChangelog': 0,
                      'icon': f'{url_base}/icon/{ext}.png',
                      'sources': [{'id': src_id, 'lang': lang, 'name': name_val, 'baseUrl': b_url_val, 'versionId': 1}]
                  })
          
          # 3. FIXED: Made all JSON files identical arrays so Mihon won't crash
          with open('repo/index.min.json','w') as f: json.dump(index,f,separators=(',',':'))
          with open('repo/index.json','w') as f: json.dump(index,f,indent=2)
          with open('repo/repo.json','w') as f: json.dump(index,f,separators=(',',':'))
          "
          echo "--- GENERATED index.min.json ---"
          cat repo/index.min.json

      - name: Publish to repo branch
        run: |
          cd repo
          git init -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish extension repo"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:repo
