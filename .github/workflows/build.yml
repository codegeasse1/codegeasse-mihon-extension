name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No committed Gradle wrapper jar is needed - this action provisions
      # a real Gradle distribution and puts `gradle` on PATH.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build every extension (debug APKs)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

  # Runs only on pushes to main, and only if `build` succeeded.
  # Bundles the compiled APKs plus an index.min.json so this repo can be
  # added directly as a custom extension repo inside Mihon/Aniyomi.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APKs
        run: gradle assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p repo/apk
          find . -path '*/build/outputs/apk/release/*.apk' -exec cp {} repo/apk/ \;

      - name: Upload repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-repo
          path: repo/
