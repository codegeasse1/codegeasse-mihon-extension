name: Yurivan Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages behind age gate
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          mkdir -p out
          curl -s -L -A "$UA" -H "Cookie: age_verified=remember" "https://www.yurivan.com/" -o out/home.html
          curl -s -L -A "$UA" -H "Cookie: age_verified=remember" "https://www.yurivan.com/explore" -o out/explore.html
          curl -s -L -A "$UA" -H "Cookie: age_verified=remember" "https://www.yurivan.com/story/005362f9-b068-4969-ab9c-8855264c798c" -o out/story.html
          curl -s -L -A "$UA" -H "Cookie: age_verified=remember" "https://www.yurivan.com/story/005362f9-b068-4969-ab9c-8855264c798c/chapter/1" -o out/chapter.html
          curl -s -L -A "$UA" -H "Cookie: age_verified=remember" "https://www.yurivan.com/search?q=love" -o out/search.html
          curl -s -L -A "$UA" -H "Cookie: age_verified=remember" "https://www.yurivan.com/tags" -o out/tags.html
          for f in out/*.html; do echo "== $f: $(wc -c < $f) bytes, title: $(grep -o '<title>[^<]*</title>' $f | head -1)"; done
          echo "GATE_CHECK: $(grep -l 'age-gate' out/*.html || echo none-has-gate)"
          echo "HAS_NEXT_DATA: $(grep -c '__NEXT_DATA__' out/*.html 2>/dev/null || true)"
          echo "FLIGHT: $(grep -o 'self.__next_f' out/home.html | wc -l)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yurivan-pages
          path: out/
          if-no-files-found: error
